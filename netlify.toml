[build]
  command = "pnpm generate"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10.6.2"
  PNPM_FLAGS = "--shamefully-hoist"

# Nuxt runs as a client-rendered SPA (`ssr: false`). Send direct visits and
# browser refreshes on nested routes through the generated application shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

